[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-xstate"
version = "0.1.0"
description = "Parse IBM Enterprise COBOL and emit its control flow as an XState v5 JSON Harel statechart (a modernization rewrite contract)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Howard" }]
keywords = ["cobol", "mainframe", "xstate", "statechart", "harel", "modernization", "parser"]

# Both dependencies ship from the mainframe-common repository (one repo, two
# distributions in subdirectories). Until they are on an index, version pins here mean
# a bare `pip install cobol-xstate` cannot resolve them - install all three in one
# command with explicit direct references (which these pins accept):
#
#   pip install "mainframe-artifacts @ git+https://github.com/paulhowarda-bit/mainframe-common#subdirectory=mainframe-artifacts" \
#               "cobol-parser @ git+https://github.com/paulhowarda-bit/mainframe-common#subdirectory=cobol-parser" \
#               "cobol-xstate @ git+https://github.com/paulhowarda-bit/cobol-xstate-json#subdirectory=cobol"
#
# Deliberately NOT direct git references in dependencies themselves, unlike the [jcl]
# extra below. The extra's reference is inert until someone asks for [jcl]; a HARD
# dependency's reference is resolved on every install, and pip (proven on 25.0.1)
# git-clones it even when the same-named project is supplied as a local editable in
# the same command - an already-installed editable does not satisfy a direct-URL
# requirement whose URL differs. That would break the offline editable flow
# (tools/prove_separation.py, the documented dev install) and, once the URL exists,
# silently replace editable mainframe-artifacts/cobol-parser installs with snapshot clones.
dependencies = ["mainframe-artifacts>=0.1,<0.2", "cobol-parser>=0.1,<0.2"]

[project.optional-dependencies]
# --bind-jcl closes the ddname->dataset join, which needs the JCL half. It is an EXTRA
# rather than a dependency because a COBOL install without it is a complete, working
# install that simply cannot do that one join - and because the two are peers, so making
# one require the other would settle a hierarchy that does not exist.
# A direct git reference while jcl-dependencies is not on an index. Swap to a
# version pin ("jcl-dependencies>=0.1,<0.2") when it is published - PyPI rejects
# direct references in uploaded metadata.
jcl = ["jcl-dependencies @ git+https://github.com/paulhowarda-bit/jcl-dependencies"]
dev = ["pytest>=7"]

[project.scripts]
cobol-xstate = "cobol_xstate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The JS decimal runtime + reference driver ship INSIDE the package: `--target js`
# writes cobolRuntime.mjs beside the emitted module, so it must be importable from an
# installed wheel, not only from a source checkout.
[tool.setuptools.package-data]
cobol_xstate = ["runtime/*.mjs"]
