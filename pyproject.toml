# Development root. This is NOT a distribution - the three that ship live in core/,
# cobol/ and jcl/, each with its own pyproject.toml:
#
#   core/  cobol-xstate-core   the estate boundary and two-stage retrieval, shared
#   cobol/ cobol-xstate        COBOL -> XState statechart      (depends on core)
#   jcl/   cobol-xstate-jcl    JCL -> dataflow + dependencies  (depends on core)
#
# What this file exists for is running the whole suite together, across all three, from
# a checkout with nothing installed. Install them for real with:
#
#   python -m pip install -e core -e cobol -e jcl
#
# The JCL half is an EXTRA of cobol-xstate rather than a dependency (`pip install
# cobol-xstate[jcl]`), because a COBOL install without it is complete - it simply cannot
# close the ddname->dataset join that --bind-jcl performs.

[tool.pytest.ini_options]
# All three source trees on sys.path, so `python -m pytest` works with nothing installed
# (pytest >= 7). Order does not matter: the three packages have distinct import names.
pythonpath = ["core/src", "cobol/src", "jcl/src", "cobol/tests"]
testpaths = ["core/tests", "cobol/tests", "jcl/tests"]
